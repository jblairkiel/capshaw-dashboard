# nginx site for the member portal: /etc/nginx/sites-available/capshaw
#
# Copy it over the live one, then `sudo nginx -t && sudo systemctl reload nginx`.
# certbot adds the `listen 443 ssl` and certificate lines itself the first
# time it runs (`sudo certbot --nginx -d capshaw.jblairkiel.com`); on a box
# where it already has, keep those lines and change only what is below.

# Leave the nginx version out of the Server header and error pages. This file
# is included inside nginx's http {} block, so this applies to every site on
# the box, the default one answering the bare IP included.
server_tokens off;

server {
    server_name capshaw.jblairkiel.com;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Who is really asking. The app trusts exactly one proxy (app.js), so
        # it reads the visitor from these. X-Forwarded-For is *set*, not
        # appended to: nginx is the edge, so the address it saw is the only
        # one worth believing, and anything the visitor typed is dropped.
        # Without these every visitor arrives as nginx and shares one
        # sign-in rate limit.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # The session cookie is `secure`; the app needs to know it was HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
