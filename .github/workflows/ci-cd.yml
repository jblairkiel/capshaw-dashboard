name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: cd client && npm ci

      - name: Server tests (Jest)
        run: npm run test:coverage

      - name: Client tests (Vitest)
        run: npm run test:client:coverage

      - name: Lint (ESLint)
        run: cd client && npm run lint

      - name: Build client
        run: npm run build

      # Blocks the merge (and therefore the deploy, which needs this job) on
      # any high or critical known vulnerability in either package tree —
      # dependencies are the check where "found later" usually means "found
      # by someone using it against you". Moderate/low findings still show up
      # in `npm audit` output locally and in Dependabot PRs; they don't fail
      # the build, so an advisory in an unrelated dev tool can't hold every
      # PR hostage.
      - name: Security audit (root)
        run: npm audit --audit-level=high

      - name: Security audit (client)
        run: cd client && npm audit --audit-level=high

      # ── Coverage reporting ───────────────────────────────────────────────────
      # Runs even if a test step above failed, so a coverage report is still
      # visible for a failing run — it just also reports any suite that never
      # produced coverage data.
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.js

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/lcov-report
            coverage/lcov.info
            client/coverage/lcov-report
            client/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage-summary.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8') +
              '\n<sub>Updated automatically on every push to this PR.</sub>\n' +
              '<!-- coverage-summary-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('<!-- coverage-summary-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # ── The container image ──────────────────────────────────────────────────────
  # A Dockerfile nothing builds is a Dockerfile that has stopped working, so
  # this builds it on every PR — and then runs it, because building proves
  # only that the layers assemble. The native SQLite addon, the client build
  # landing where the server looks for it, and the app actually serving are
  # each things a successful build would not have caught.
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used on a push to main, by the publish step at the end.
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: capshaw-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        run: |
          set -e
          # The app refuses to boot in production without a session secret, so
          # give it a throwaway one. Everything else is optional: no scraper
          # credentials, no mail server, no API key — this is about whether the
          # image serves, not about what it can reach.
          docker run -d --name capshaw --init \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -p 3001:3001 \
            capshaw-dashboard:ci

      - name: Wait for it to report healthy
        run: |
          set -e
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' capshaw 2>/dev/null || echo missing)
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            if [ "$(docker inspect --format='{{.State.Running}}' capshaw)" != "true" ]; then
              echo "::error::The container stopped on its own."
              docker logs capshaw
              exit 1
            fi
            sleep 2
          done
          echo "::error::The container never reported healthy."
          docker logs capshaw
          docker inspect --format='{{json .State.Health}}' capshaw
          exit 1

      - name: Check what it serves
        run: |
          set -e
          # The health endpoint, which is outside the sign-in gate.
          curl -fsS http://127.0.0.1:3001/api/health | tee /dev/stderr | grep -q '"status":"ok"'

          # The React build, which only exists in the image if the client stage
          # ran and the runtime stage copied it where the server looks.
          curl -fsS http://127.0.0.1:3001/ | grep -qi '<div id="root"'

          # The portal itself is members-only, and stays that way in a
          # container: an unauthenticated API call is refused, not served.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/members/data)
          [ "$code" = "401" ] || { echo "::error::Expected 401 from a signed-out API call, got $code"; exit 1; }

      - name: Check it wrote to the volume rather than into the image
        run: |
          set -e
          # The database is created on first boot. It has to land in /data, or
          # a redeploy would take the congregation's records with it.
          docker exec capshaw sh -c 'test -f /data/bible_questions.db' \
            || { echo "::error::No database under /data — check CAPSHAW_DATA_DIR in the Dockerfile."; exit 1; }

          # And the process must not be root, so a compromise inside the
          # container is not root inside the container.
          who=$(docker exec capshaw id -un)
          [ "$who" = "node" ] || { echo "::error::The app runs as $who, expected node"; exit 1; }

      - name: Logs, whatever happened
        if: always()
        run: docker logs capshaw || true

      - name: Stop it
        if: always()
        run: docker rm -f capshaw || true

      # Published only once the image above has served a request, reported
      # healthy and written to its volume. The deploy job below pulls this
      # exact digest, so what runs on the droplet is what was exercised here
      # rather than a rebuild of the same commit.
      - name: Sign in to the registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish it
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The commit tag is what the deploy pins to; `main` is a convenience
          # for looking at what is current by hand.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to capshaw.jblairkiel.com
    # Only what CI built and exercised gets deployed, so the image job has to
    # have published before there is anything to pull.
    needs: [test, image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy the container
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e
            cd /var/www/capshaw-dashboard

            # Only the compose file and the .env on this host are still read
            # from the checkout; the application itself arrives as an image.
            #
            # Installing Docker is done as root, and a `sudo git pull` along
            # the way leaves this checkout owned by root while the deploy user
            # is somebody else. Git then refuses to read it at all — "dubious
            # ownership" — which stops the deploy before it has looked at a
            # single container. The deploy only ever reads this repository, so
            # say once that the directory is trusted.
            if ! git config --global --get-all safe.directory 2>/dev/null \
              | grep -qx /var/www/capshaw-dashboard; then
              git config --global --add safe.directory /var/www/capshaw-dashboard
            fi

            if ! git pull origin main; then
              echo "::error::Could not update the checkout at /var/www/capshaw-dashboard."
              echo "The deploy reads docker-compose.yml and .env from there."
              echo "If git reported a permission problem, the files belong to"
              echo "another user; hand them back to the deploy user with:"
              echo "  sudo chown -R \$USER:\$USER /var/www/capshaw-dashboard"
              exit 1
            fi

            # A host that has never run a container says "docker: command not
            # found" from whichever line reaches for it first, which reads like
            # a broken deploy rather than a missing prerequisite. Say which it
            # is, and where the one-time setup is written down.
            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::Docker is not installed on this host."
              echo "This deploy runs the app as a container. Install Docker and"
              echo "migrate the data once, then deploys work from here on:"
              echo "  README → Moving an existing droplet from PM2 to the container"
              exit 1
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "::error::Docker is installed but the compose plugin is not."
              echo "Install docker-compose-plugin — see the README section above."
              exit 1
            fi
            # Docker installs as root-only. Until the deploy user is in the
            # docker group, every command below fails on the socket with a
            # permission error that never says what to do about it.
            if ! docker info >/dev/null 2>&1; then
              echo "::error::Docker is installed, but this user cannot reach it."
              echo "Add the deploy user to the docker group, once:"
              echo "  sudo usermod -aG docker \$USER"
              echo "Then open a new login session so the group takes effect."
              exit 1
            fi

            echo "${{ secrets.GHCR_TOKEN }}" \
              | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # What is serving now, so a bad deploy has something to go back to.
            # A first run has nothing running and nothing to roll back to.
            previous=$(docker inspect --format='{{.Config.Image}}' \
              "$(docker compose ps -q app 2>/dev/null)" 2>/dev/null || echo "")
            echo "currently running: ${previous:-nothing}"
            echo "deploying:         $IMAGE"

            export CAPSHAW_IMAGE="$IMAGE"
            docker compose pull app

            # ── The port ─────────────────────────────────────────────────────
            # PM2 served this app before the cutover and does not stay stopped:
            # a reboot or a `pm2 resurrect` brings it back, and it then takes
            # 127.0.0.1:3001 the moment compose stops the old container in
            # order to recreate it — so the new container has nowhere to bind.
            # The container is what serves now, so the deploy stops PM2 rather
            # than losing that race. Stopped, not deleted: if this deploy does
            # not come up, PM2 is started again below and the site keeps being
            # served by the build it was already serving.
            pm2_was_running=0
            if command -v pm2 >/dev/null 2>&1 &&
               pm2 pid capshaw-dashboard 2>/dev/null | grep -qE '^[1-9]'; then
              echo "PM2 still serves capshaw-dashboard; stopping it for the container."
              pm2 stop capshaw-dashboard || true
              pm2_was_running=1
              # The listening socket goes away a moment after the process does.
              for _ in $(seq 1 10); do
                ss -ltn 2>/dev/null | grep -q '127.0.0.1:3001' || break
                sleep 1
              done
            fi

            # `set -e` would end the job right here on a start that fails,
            # skipping the logs and the rollback below — which is exactly when
            # both are wanted. A container that will not start is a failed
            # deploy, not a broken script.
            started=1
            docker compose up -d --no-build app || started=0

            # ── Health check ─────────────────────────────────────────────────
            # The container has its own HEALTHCHECK, so this asks Docker what it
            # thinks rather than curling and hoping: a container that is up but
            # failing its check is not a successful deploy. Polls rather than
            # sleeping once, because a cold start opens the database and runs
            # migrations, which takes longer on a tired droplet than on a
            # runner.
            healthy=0
            if [ "$started" = "1" ]; then
              echo "Waiting for the container to report healthy..."
              for _ in $(seq 1 30); do
                state=$(docker inspect --format='{{.State.Health.Status}}' \
                  "$(docker compose ps -q app)" 2>/dev/null || echo missing)
                if [ "$state" = "healthy" ]; then healthy=1; break; fi
                if [ "$state" = "missing" ]; then
                  echo "the container is not running"
                  break
                fi
                sleep 3
              done
            fi

            if [ "$healthy" = "1" ]; then
              echo "Healthy. Now serving $IMAGE"
              if [ "$pm2_was_running" = "1" ]; then
                echo ""
                echo "PM2 was stopped to free the port and is left stopped."
                echo "A reboot or a \`pm2 resurrect\` would start it again and"
                echo "this deploy would have to stop it again. To retire it:"
                echo "  pm2 delete capshaw-dashboard && pm2 save"
                echo "The way back stays \`docker compose down\` then"
                echo "\`pm2 start ecosystem.config.js --env production\`."
              fi
              # Keep the last few images so a rollback by hand has something to
              # go back to, and the disk does not fill with every deploy.
              docker image prune -af --filter "until=720h" >/dev/null 2>&1 || true
              exit 0
            fi

            # ── It did not come up ───────────────────────────────────────────
            echo ""
            if [ "$started" = "1" ]; then
              echo "=== DEPLOY FAILED — the container never reported healthy ==="
            else
              echo "=== DEPLOY FAILED — the container would not start ==="
            fi
            docker compose ps
            echo ""
            echo "=== Logs (last 200 lines) ==="
            docker compose logs --tail 200 app || true

            # The one failure whose cause is outside the container: something
            # else on the host already has the port. On this droplet that is
            # the PM2 process coming back — it restarts on its own, so it
            # takes 3001 the moment a container stops and holds it against
            # the next one.
            echo ""
            echo "=== What holds 127.0.0.1:3001 ==="
            ss -ltnp 2>/dev/null | grep -E '[:.]3001' \
              || echo "nothing else is listening on 3001"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 list 2>/dev/null || true
              echo "If PM2 is listed as online above, something started it"
              echo "after this job stopped it, and it is holding the port"
              echo "against the container. Retire it for good with:"
              echo "  pm2 delete capshaw-dashboard && pm2 save"
            fi

            rolled_back=0
            if [ -n "$previous" ]; then
              echo ""
              echo "=== Rolling back to $previous ==="
              export CAPSHAW_IMAGE="$previous"
              # A rollback that cannot start either — the port is still held,
              # say — must not end the job before it has said so.
              docker compose up -d --no-build app || true
              for _ in $(seq 1 20); do
                state=$(docker inspect --format='{{.State.Health.Status}}' \
                  "$(docker compose ps -q app)" 2>/dev/null || echo missing)
                if [ "$state" = "healthy" ]; then
                  echo "Rolled back; the previous image is serving again."
                  rolled_back=1
                  break
                fi
                sleep 3
              done
            else
              echo "Nothing was running before this, so there is nothing to roll back to."
            fi

            # Nothing came up, and PM2 was serving the site until this job
            # stopped it. Give it back rather than leaving the site dark.
            if [ "$pm2_was_running" = "1" ] && [ "$rolled_back" = "0" ]; then
              echo ""
              echo "=== Nothing is serving; starting PM2 again ==="
              pm2 start capshaw-dashboard || true
            fi

            exit 1
