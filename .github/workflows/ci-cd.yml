name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: cd client && npm ci

      - name: Server tests (Jest)
        run: npm run test:coverage

      - name: Client tests (Vitest)
        run: npm run test:client:coverage

      - name: Lint (ESLint)
        run: cd client && npm run lint

      - name: Build client
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # ── Coverage reporting ───────────────────────────────────────────────────
      # Runs even if a test step above failed, so a coverage report is still
      # visible for a failing run — it just also reports any suite that never
      # produced coverage data.
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.js

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/lcov-report
            coverage/lcov.info
            client/coverage/lcov-report
            client/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage-summary.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8') +
              '\n<sub>Updated automatically on every push to this PR.</sub>\n' +
              '<!-- coverage-summary-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('<!-- coverage-summary-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to capshaw.jblairkiel.com
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/capshaw-dashboard

            git pull origin main

            # The toolchain (vite 8 / vitest 5) requires Node >=22.12 — fail
            # fast with a clear message rather than a cryptic npm ci error if
            # this host's Node hasn't been upgraded to match package.json's
            # engines field.
            node -e "
              const need = [22, 12];
              const have = process.versions.node.split('.').map(Number);
              if (have[0] < need[0] || (have[0] === need[0] && have[1] < need[1])) {
                console.error(\`Node \${process.versions.node} is too old — this app needs >=22.12.0. Upgrade Node on this host before deploying.\`);
                process.exit(1);
              }
            "

            # Server deps (production only)
            npm ci --omit=dev

            # Build React
            cd client
            npm ci
            npm run build
            cd ..

            # Restart app
            pm2 restart ecosystem.config.js --env production
            pm2 save

            # Health check
            echo "Waiting for server to start..."
            sleep 5
            if ! curl -sf http://localhost:3001/api/health; then
              echo ""
              echo "=== HEALTH CHECK FAILED — last 40 PM2 log lines ==="
              pm2 logs capshaw-dashboard --lines 40 --nostream 2>&1 || true
              echo "=== PM2 describe ==="
              pm2 describe capshaw-dashboard 2>&1 || true
              exit 1
            fi
            echo "Deployment verified OK"
