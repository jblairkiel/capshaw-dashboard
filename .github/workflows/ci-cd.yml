name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: cd client && npm ci

      - name: Server tests (Jest)
        run: npm run test:coverage

      - name: Client tests (Vitest)
        run: npm run test:client:coverage

      - name: Lint (ESLint)
        run: cd client && npm run lint

      - name: Build client
        run: npm run build

      # Blocks the merge (and therefore the deploy, which needs this job) on
      # any high or critical known vulnerability in either package tree —
      # dependencies are the check where "found later" usually means "found
      # by someone using it against you". Moderate/low findings still show up
      # in `npm audit` output locally and in Dependabot PRs; they don't fail
      # the build, so an advisory in an unrelated dev tool can't hold every
      # PR hostage.
      - name: Security audit (root)
        run: npm audit --audit-level=high

      - name: Security audit (client)
        run: cd client && npm audit --audit-level=high

      # ── Coverage reporting ───────────────────────────────────────────────────
      # Runs even if a test step above failed, so a coverage report is still
      # visible for a failing run — it just also reports any suite that never
      # produced coverage data.
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.js

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/lcov-report
            coverage/lcov.info
            client/coverage/lcov-report
            client/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage-summary.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8') +
              '\n<sub>Updated automatically on every push to this PR.</sub>\n' +
              '<!-- coverage-summary-comment -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('<!-- coverage-summary-comment -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # ── The container image ──────────────────────────────────────────────────────
  # A Dockerfile nothing builds is a Dockerfile that has stopped working, so
  # this builds it on every PR — and then runs it, because building proves
  # only that the layers assemble. The native SQLite addon, the client build
  # landing where the server looks for it, and the app actually serving are
  # each things a successful build would not have caught.
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: capshaw-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        run: |
          set -e
          # The app refuses to boot in production without a session secret, so
          # give it a throwaway one. Everything else is optional: no scraper
          # credentials, no mail server, no API key — this is about whether the
          # image serves, not about what it can reach.
          docker run -d --name capshaw --init \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -p 3001:3001 \
            capshaw-dashboard:ci

      - name: Wait for it to report healthy
        run: |
          set -e
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' capshaw 2>/dev/null || echo missing)
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            if [ "$(docker inspect --format='{{.State.Running}}' capshaw)" != "true" ]; then
              echo "::error::The container stopped on its own."
              docker logs capshaw
              exit 1
            fi
            sleep 2
          done
          echo "::error::The container never reported healthy."
          docker logs capshaw
          docker inspect --format='{{json .State.Health}}' capshaw
          exit 1

      - name: Check what it serves
        run: |
          set -e
          # The health endpoint, which is outside the sign-in gate.
          curl -fsS http://127.0.0.1:3001/api/health | tee /dev/stderr | grep -q '"status":"ok"'

          # The React build, which only exists in the image if the client stage
          # ran and the runtime stage copied it where the server looks.
          curl -fsS http://127.0.0.1:3001/ | grep -qi '<div id="root"'

          # The portal itself is members-only, and stays that way in a
          # container: an unauthenticated API call is refused, not served.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/members/data)
          [ "$code" = "401" ] || { echo "::error::Expected 401 from a signed-out API call, got $code"; exit 1; }

      - name: Check it wrote to the volume rather than into the image
        run: |
          set -e
          # The database is created on first boot. It has to land in /data, or
          # a redeploy would take the congregation's records with it.
          docker exec capshaw sh -c 'test -f /data/bible_questions.db' \
            || { echo "::error::No database under /data — check CAPSHAW_DATA_DIR in the Dockerfile."; exit 1; }

          # And the process must not be root, so a compromise inside the
          # container is not root inside the container.
          who=$(docker exec capshaw id -un)
          [ "$who" = "node" ] || { echo "::error::The app runs as $who, expected node"; exit 1; }

      - name: Logs, whatever happened
        if: always()
        run: docker logs capshaw || true

      - name: Stop it
        if: always()
        run: docker rm -f capshaw || true

  # Still the SSH deploy: the image is built and exercised on every change, but
  # switching the droplet over to it is a separate decision — see README →
  # Running in Docker.
  deploy:
    name: Deploy to capshaw.jblairkiel.com
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/capshaw-dashboard

            git pull origin main

            # The toolchain (vite 8 / vitest 5) requires Node >=22.12 — fail
            # fast with a clear message rather than a cryptic npm ci error if
            # this host's Node hasn't been upgraded to match package.json's
            # engines field.
            node -e "
              const need = [22, 12];
              const have = process.versions.node.split('.').map(Number);
              if (have[0] < need[0] || (have[0] === need[0] && have[1] < need[1])) {
                console.error(\`Node \${process.versions.node} is too old — this app needs >=22.12.0. Upgrade Node on this host before deploying.\`);
                process.exit(1);
              }
            "

            # Server deps (production only)
            npm ci --omit=dev

            # The native SQLite addon is the one dependency that can install
            # cleanly and still be unusable: a binary that does not match this
            # Node's ABI loads fine, serves requests, and then aborts the whole
            # process from a statement destructor during garbage collection —
            # SIGABRT, no JS stack, nothing in dmesg. Prove it survives being
            # used and collected here, while the old process is still serving,
            # rather than finding out from the health check after we have
            # already replaced a working app with a crashing one.
            node --expose-gc -e "
              const Database = require('better-sqlite3');
              const db = new Database('server/data/bible_questions.db', { readonly: true });
              for (let i = 0; i < 200; i++) db.prepare('SELECT ' + i).get();
              if (global.gc) { global.gc(); global.gc(); }
              db.close();
              console.log('better-sqlite3 ' + require('better-sqlite3/package.json').version +
                          ' OK on Node ' + process.versions.node +
                          ' (ABI ' + process.versions.modules + ')');
            "

            # Build React
            cd client
            npm ci
            npm run build
            cd ..

            # How many times PM2 has had to restart the app. Compared before
            # and after the health check below: a count that climbs while we
            # watch means the app is crash-looping, which a single successful
            # curl can otherwise hide.
            restart_count() {
              pm2 jlist 2>/dev/null | node -e "
                let s = '';
                process.stdin.on('data', d => s += d).on('end', () => {
                  try {
                    const app = JSON.parse(s).find(p => p.name === 'capshaw-dashboard');
                    console.log(app ? app.pm2_env.restart_time : 'unknown');
                  } catch { console.log('unknown'); }
                });
              " || echo unknown
            }

            # Restart app
            pm2 restart ecosystem.config.js --env production
            pm2 save

            restarts_before=$(restart_count)

            # ── Health check ─────────────────────────────────────────────────
            # Polls rather than sleeping once: a cold start has to open the
            # database and run migrations, which takes longer on a tired
            # droplet than on the runner, and a fixed 5-second wait turns that
            # into a failed deploy of code that is actually fine.
            echo "Waiting for server to start..."
            healthy=0
            for _ in $(seq 1 20); do
              if curl -sf --max-time 5 http://localhost:3001/api/health; then
                healthy=1
                break
              fi
              sleep 3
            done

            if [ "$healthy" != "1" ]; then
              echo ""
              echo "=== HEALTH CHECK FAILED after 60s ==="
              echo "PM2 restarts: ${restarts_before} -> $(restart_count)"
              echo ""
              # `pm2 logs --lines 40` is useless here: express-session prints a
              # three-line MemoryStore warning on every single boot, so a
              # crash-looping app fills the whole window with that warning and
              # pushes the actual stack trace out of view. Read the log files
              # directly, drop the known noise, and take a much deeper slice.
              echo "=== Error log (last 200 lines, MemoryStore warning filtered) ==="
              tail -n 200 "$HOME/.pm2/logs/capshaw-dashboard-error-1.log" 2>/dev/null \
                | grep -v -e 'MemoryStore is not' \
                          -e 'designed for a production environment' \
                          -e 'memory, and will not scale past a single process' \
                || true
              echo ""
              echo "=== Output log (last 60 lines) ==="
              tail -n 60 "$HOME/.pm2/logs/capshaw-dashboard-out-1.log" 2>/dev/null || true
              echo ""
              echo "=== PM2 describe ==="
              pm2 describe capshaw-dashboard 2>&1 || true
              exit 1
            fi

            # Answering once is not the same as staying up. Give it a beat and
            # see whether PM2 has had to restart it again in the meantime.
            sleep 15
            restarts_after=$(restart_count)
            if [ "$restarts_before" != "unknown" ] && [ "$restarts_after" != "$restarts_before" ]; then
              echo ""
              echo "############################################################"
              echo "# WARNING: the app answered the health check but PM2 has"
              echo "# restarted it again since (${restarts_before} -> ${restarts_after})."
              echo "# It is crashing and being restarted, not running steadily."
              echo "# Recent errors:"
              echo "############################################################"
              tail -n 200 "$HOME/.pm2/logs/capshaw-dashboard-error-1.log" 2>/dev/null \
                | grep -v -e 'MemoryStore is not' \
                          -e 'designed for a production environment' \
                          -e 'memory, and will not scale past a single process' \
                | tail -n 40 || true
            fi

            echo "Deployment verified OK"
