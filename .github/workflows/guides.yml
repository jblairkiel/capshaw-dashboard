# Records the how-to video guides in tools/guides on GitHub's own machines,
# so nobody needs to set up Playwright locally, and attaches the videos and
# their contact sheets to the run as a download.
#
# Each run builds a throwaway copy of the portal from the app's sample data
# (tools/guides/setup), so it uses no secrets and touches no real data, and
# the portal it starts can neither scrape the church site nor send email
# (tools/guides/lib/servers.js).
name: Video guides

on:
  push:
    branches: ['claude/how-to-videos**']
    paths: ['tools/guides/**', '.github/workflows/guides.yml']
  workflow_dispatch:
    inputs:
      guides:
        description: Guides to record, separated by spaces
        default: create-account approve-member my-week serving household upcoming-service signups calendar groups rotations inbox bible-class site-jobs admin-tools

permissions:
  contents: read

env:
  ALL_GUIDES: create-account approve-member my-week serving household upcoming-service signups calendar groups rotations inbox bible-class site-jobs admin-tools

jobs:
  # One recording job per guide, side by side.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      guides: ${{ steps.list.outputs.guides }}
    steps:
      - id: list
        env:
          GUIDES: ${{ inputs.guides || env.ALL_GUIDES }}
        run: echo "guides=$(printf '%s\n' $GUIDES | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  record:
    needs: plan
    name: record ${{ matrix.guide }}
    strategy:
      fail-fast: false
      matrix:
        guide: ${{ fromJSON(needs.plan.outputs.guides) }}
    runs-on: ubuntu-24.04   # the pinned Playwright has no Chromium for 26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the app
        run: |
          npm ci
          (cd client && npm ci)

      - name: Install the guide recorder
        run: |
          cd tools/guides
          npm ci
          npx playwright install --with-deps chromium
          pip install -r requirements.txt

      - name: Record
        run: node tools/guides/run.js "${{ matrix.guide }}"

      - name: Attach the videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-${{ matrix.guide }}
          path: |
            tools/guides/output/
            tools/guides/work/*/failed-*.png
            tools/guides/work/*/*.log
          if-no-files-found: warn
          retention-days: 14
